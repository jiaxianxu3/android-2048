name: 构建 2048 双模式 APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ACLOCAL_PATH: /usr/share/aclocal
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3-dev build-essential git zip unzip curl pkg-config \
            openjdk-17-jdk autoconf automake libtool libtool-bin \
            libssl-dev libffi-dev zlib1g-dev libbz2-dev \
            libsqlite3-dev libncurses-dev liblzma-dev libgdbm-dev \
            tk-dev uuid-dev libreadline-dev libxml2-dev libxslt1-dev

          test -f /usr/share/aclocal/libtool.m4
          grep -q 'LT_SYS_SYMBOL_USCORE' /usr/share/aclocal/libtool.m4

      - name: 创建 Python 环境
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0"

      - name: 清理失败的构建缓存
        run: |
          rm -rf .buildozer bin

      - name: 构建 APK
        timeout-minutes: 100
        run: |
          set -euxo pipefail
          . .venv/bin/activate
          export PATH="$GITHUB_WORKSPACE/.venv/bin:/usr/bin:$PATH"
          buildozer android debug 2>&1 | tee buildozer.log
          echo "== 构建产物校验 =="
          ls -la bin/*.apk

      - name: 列出生成的 APK（诊断用，始终执行）
        if: always()
        run: |
          echo "== 全盘查找 *.apk =="
          find "$GITHUB_WORKSPACE" -name '*.apk' -type f | sort
          echo "== bin 目录内容 =="
          ls -la "$GITHUB_WORKSPACE/bin" 2>/dev/null || echo "bin 目录不存在"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: ignore

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: game2048-dual-apk
          path: bin/*.apk
          if-no-files-found: error
